name: MyGirl Android bundle smoke test
on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/mobile-bundle.yml'
  pull_request:
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/mobile-bundle.yml'
  workflow_dispatch:
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Bundle native Android JavaScript
        run: npx expo export --platform android --output-dir /tmp/mygirl-android-export
