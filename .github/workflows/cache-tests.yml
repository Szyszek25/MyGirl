name: Mobile storage regression tests
on:
  push:
    branches: [main]
    paths:
      - 'src/cache.js'
      - 'src/localProfile.js'
      - 'tests/cache.test.mjs'
      - 'tests/localProfile.test.mjs'
      - 'package.json'
      - '.github/workflows/cache-tests.yml'
  pull_request:
    paths:
      - 'src/cache.js'
      - 'src/localProfile.js'
      - 'tests/cache.test.mjs'
      - 'tests/localProfile.test.mjs'
      - 'package.json'
      - '.github/workflows/cache-tests.yml'
  workflow_dispatch:
jobs:
  storage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
